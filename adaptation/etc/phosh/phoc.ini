# Lenovo Tab M10 HD (2nd gen) - 10.1" 1280x800 panel
#
# Droidian's phoc talks to libhybris' hwcomposer backend on MediaTek, so the
# outputs are named HWCOMPOSER-<display id>.  The exact id differs between
# phoc/wlroots versions, so cover the common ones; unknown outputs are simply
# ignored.  DSI-1 is kept for the plain DRM case.
#
# Scale 1.5 gives a comfortable tablet UI (853x533 logical pixels).  Change it
# to 1 or 2 from Settings -> Displays (or here) if you prefer a different size.

[output:HWCOMPOSER-1]
scale = 1.5

[output:HWCOMPOSER-0]
scale = 1.5

[output:HWCOMPOSER-151]
scale = 1.5

[output:HWCOMPOSER-2]
scale = 1.5

[output:HWCOMPOSER-2-1]
scale = 1.5

[output:DSI-1]
scale = 1.5

[output:Virtual-1]
modeline = 87.25  720 776 848 976  1440 1443 1453 1493 -hsync +vsync
mode = 720x1440
scale = 2
